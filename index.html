<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Arbre faluchard — UP médecine</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --velvet:#17121a;        /* fond toile : velours faluche */
    --velvet-2:#221826;
    --parch:#f4efe6;         /* parchemin : panneaux */
    --parch-line:#e2d9c8;
    --ink:#241c27;
    --ink-soft:#6b6070;
    --rouge:#a3232f;         /* rouge médecine (filière) */
    --rouge-bright:#cf3b40;
    --gold:#e7c15a;
    --teal:#19a78e;
    /* ░░ Réglages de la case « parrains / filleul·e·s » — modifie ces 2 valeurs ░░
       --chips-max  : hauteur max de CHAQUE liste de noms avant défilement (rangées de pastilles)
       --focus-max  : hauteur max de toute la case avant défilement                            */
    --chips-max:128px;
    --focus-max:300px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--velvet)}
  #app{display:grid;grid-template-columns:312px 1fr;height:100%}
  /* ---- panneau latéral ---- */
  aside{
    background:var(--parch);border-right:1px solid var(--parch-line);
    padding:20px 20px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;z-index:3
  }
  .brand{line-height:1.1}
  .brand h1{font-family:Spectral,serif;font-weight:600;font-size:22px;margin:0;letter-spacing:.2px}
  .brand .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rouge);margin-top:6px;font-weight:600}
  .stats{display:flex;gap:14px;font-size:12px;color:var(--ink-soft)}
  .stats b{display:block;font-size:17px;color:var(--ink);font-weight:600;font-family:Spectral,serif}
  .field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
  input[type=search]{
    width:100%;padding:9px 11px;border:1px solid var(--parch-line);border-radius:8px;
    font:inherit;font-size:14px;background:#fff;color:var(--ink)
  }
  input[type=search]:focus{outline:2px solid var(--rouge);outline-offset:1px;border-color:transparent}
  .depth{display:flex;align-items:center;gap:10px}
  .depth input{flex:1}
  .depth .val{font-family:Spectral,serif;font-size:15px;min-width:54px;text-align:right;color:var(--rouge)}
  input[type=range]{accent-color:var(--rouge)}
  .seg{display:flex;border:1px solid var(--parch-line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:0;background:#fff;padding:7px 4px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink-soft)}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--parch)}
  .focusbox{background:#fff;border:1px solid var(--parch-line);border-radius:10px;padding:13px 14px;min-height:64px;max-height:var(--focus-max);overflow-y:auto}
  .focusbox .ph{color:var(--ink-soft);font-size:13px;line-height:1.5}
  .focusbox h2{font-family:Spectral,serif;font-size:18px;margin:0 0 8px;line-height:1.15}
  .lineage{font-size:12.5px;line-height:1.7}
  .lineage .row{display:flex;gap:8px;align-items:baseline}
  .lineage .tag{min-width:74px;color:var(--ink-soft);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .lineage .tag.up{color:var(--rouge)}
  .lineage .tag.down{color:var(--teal)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px;max-height:var(--chips-max);overflow-y:auto;padding-right:2px}
  .chips::-webkit-scrollbar,.focusbox::-webkit-scrollbar{width:7px}
  .chips::-webkit-scrollbar-thumb,.focusbox::-webkit-scrollbar-thumb{background:var(--parch-line);border-radius:7px}
  .chips{scrollbar-width:thin;scrollbar-color:var(--parch-line) transparent}
  .chip{background:var(--parch);border:1px solid var(--parch-line);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--rouge);color:var(--rouge)}
  .legend{font-size:12px;color:var(--ink-soft);line-height:1.9}
  .legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
  .btn{border:1px solid var(--parch-line);background:#fff;border-radius:8px;padding:9px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--rouge);color:var(--rouge)}
  .hint{font-size:11px;color:var(--ink-soft);line-height:1.55;margin-top:auto;padding-top:8px;border-top:1px solid var(--parch-line)}
  /* ---- toile ---- */
  main{position:relative;overflow:hidden}
  canvas{display:block;cursor:grab}
  canvas.grabbing{cursor:grabbing}
  #tip{
    position:absolute;pointer-events:none;background:var(--velvet-2);color:var(--parch);
    border:1px solid #3a2f44;border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.5;
    opacity:0;transition:opacity .12s;max-width:240px;z-index:5;box-shadow:0 6px 22px rgba(0,0,0,.45)
  }
  #tip b{font-family:Spectral,serif;font-weight:600;font-size:14px}
  #tip .meta{color:#b7a7c4;font-size:11.5px;margin-top:2px}
  .float{position:absolute;left:16px;bottom:14px;display:flex;gap:8px;z-index:4}
  .float button{background:var(--velvet-2);color:var(--parch);border:1px solid #3a2f44;border-radius:8px;width:34px;height:34px;font-size:17px;cursor:pointer;line-height:1}
  .float button:hover{border-color:var(--rouge-bright)}
  /* mobile */
  #burger{display:none}
  @media(max-width:760px){
    #app{grid-template-columns:1fr}
    aside{position:fixed;inset:0 auto 0 0;width:296px;transform:translateX(-100%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.4)}
    aside.open{transform:none}
    #burger{display:block;position:absolute;top:12px;left:12px;z-index:6;background:var(--velvet-2);color:var(--parch);border:1px solid #3a2f44;border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  /* ---- porte d'entrée (mot de passe) ---- */
  #gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 30%, #221826 0%, var(--velvet) 70%);transition:opacity .42s ease}
  #gate.ok{opacity:0;pointer-events:none}
  .gate-card{width:min(92vw,360px);background:var(--parch);border:1px solid var(--parch-line);border-radius:16px;
    padding:30px 28px 26px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .gate-emb{font-size:30px;color:var(--rouge);line-height:1;margin-bottom:6px}
  .gate-card h1{font-family:Spectral,serif;font-weight:600;font-size:25px;margin:0;color:var(--ink)}
  .gate-sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rouge);font-weight:600;margin:6px 0 0}
  .gate-msg{font-size:13px;line-height:1.55;color:var(--ink-soft);margin:16px 0 18px}
  #gate-pass{width:100%;padding:11px 13px;border:1px solid var(--parch-line);border-radius:9px;font:inherit;font-size:15px;background:#fff;color:var(--ink);text-align:center}
  #gate-pass:focus{outline:2px solid var(--rouge);outline-offset:1px;border-color:transparent}
  #gate-go{width:100%;margin-top:12px;padding:11px;border:0;border-radius:9px;background:var(--rouge);color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s}
  #gate-go:hover{background:var(--rouge-bright)}
  .gate-err{height:16px;margin-top:10px;font-size:12.5px;color:var(--rouge);font-weight:600;opacity:0;transition:opacity .15s}
  @keyframes gate-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  #gate.shake .gate-card{animation:gate-shake .5s}
</style>
</head>
<body>
<!-- ░░ Écran de mot de passe (voir le bloc MOT_DE_PASSE dans le script pour le changer) ░░ -->
<div aria-label="Accès protégé" aria-modal="true" id="gate" role="dialog">
<div class="gate-card">
<div class="gate-emb">🌳</div>
<h1>Arbre faluchard</h1>
<div class="gate-sub">Faculté de médecine · UP</div>
<p class="gate-msg">Cet arbre est réservé aux faluchard·e·s.<br/></p>
<input autocomplete="off" autofocus="" id="gate-pass" placeholder="Mot de passe" type="password"/>
<button id="gate-go">Entrer dans l'arbre</button>
<div class="gate-err" id="gate-err">Mot de passe incorrect.</div>
</div>
</div>
<div id="app">
<aside id="panel">
<div class="brand">
<h1>Arbre faluchard</h1>
<div class="sub">Faculté de médecine · UP</div>
</div>
<div class="stats">
<div><b id="stat-n">708</b>Faluchard·e·s</div>
<div><b id="stat-e">1319</b>Parrainages</div>
<div><b id="stat-g">26</b>Générations</div>
</div>
<div class="field">
<label for="search">Chercher quelqu'un</label>
<input autocomplete="off" id="search" list="names" placeholder="Nom de faluche…" type="search"/>
<datalist id="names"></datalist>
</div>
<div class="field">
<label for="depth">Profondeur du focus</label>
<div class="depth">
<input id="depth" max="20" min="1" step="1" type="range" value="2"/>
<span class="val" id="depth-val">2 gén.</span>
</div>
</div>
<div class="field">
<label>Couleur des nœuds</label>
<div class="seg" id="colormode">
</div>
</div>
<div class="focusbox" id="focusbox">
<div class="ph">Clique sur un nœud ou cherche un nom pour isoler sa lignée.</div>
</div>
<div class="legend" id="legend"></div>
<button class="btn" id="reset">Tout réafficher</button>
</aside>
<main>
<button aria-label="Menu" id="burger">☰</button>
<canvas id="cv"></canvas>
<div id="tip"></div>
<div class="float">
<button id="zin" title="Zoom +">+</button>
<button id="zout" title="Zoom −">−</button>
<button id="zfit" title="Recadrer">⊡</button>
</div>
</main>
</div>

": "Dr Jekyll", "filleul": "Don Juan de l'Arsouille"}, {"parrain": "La Gaudriole", "filleul": "Nostradamus"}, {"parrain": "La Gaudriole", "filleul": "L'Ingénue (Julia)"}, {"parrain": "Fatal", "filleul": "Mata Hari"}, {"parrain": "George", "filleul": "Morpheus"}, {"parrain": "Fatal", "filleul": "Al Capone 2.0"}, {"parrain": "Gaston", "filleul": "Gosby La Badouille"}, {"parrain": "Hippodium", "filleul": "Vénus"}, {"parrain": "Frère Frakass", "filleul": "Bagheera"}, {"parrain": "Frère Frakass", "filleul": "JeanJacqueur de Lion"}, {"parrain": "La Gaudriole", "filleul": "Frontal"}, {"parrain": "La Bayadère", "filleul": "Ponyo"}, {"parrain": "Thor", "filleul": "Goudurix"}, {"parrain": "Gaston", "filleul": "Kasé de Plougastel"}, {"parrain": "Quintal", "filleul": "Ulysse"}, {"parrain": "L'Ingénue (Julia)", "filleul": "Spartacus"}, {"parrain": "Thor", "filleul": "Marilyn"}, {"parrain": "Al Capone 2.0", "filleul": "Musashi"}, {"parrain": "Vénus", "filleul": "Stimulus"}, {"parrain": "Gaston", "filleul": "Kick-Ass"}, {"parrain": "Gosby La Badouille", "filleul": "Le Roi Merlin"}, {"parrain": "Thor", "filleul": "Maestro"}, {"parrain": "JeanJacqueur de Lion", "filleul": "Frère Tcheese"}, {"parrain": "Hippodium", "filleul": "Mistinguett"}, {"parrain": "Goudurix", "filleul": "Antigone"}, {"parrain": "Ulysse", "filleul": "Jean Pierrot de la Cuisse"}, {"parrain": "Frontal", "filleul": "Gargamelle dite la Brute"}, {"parrain": "Spartacus", "filleul": "Maximus dit le Truand"}, {"parrain": "Ponyo", "filleul": "Apollo dit le Bon"}, {"parrain": "La Bayadère", "filleul": "L'Oxymore"}, {"parrain": "Frontal", "filleul": "Chaplin"}, {"parrain": "Morpheus", "filleul": "Astus du Brindacier"}, {"parrain": "Ponyo", "filleul": "Bolus"}, {"parrain": "Goudurix", "filleul": "Le Byzantin"}, {"parrain": "JeanJacqueur de Lion", "filleul": "Michelangelo"}, {"parrain": "Mistinguett", "filleul": "L'Utopic"}, {"parrain": "Thor", "filleul": "Petit Jean du Grand Gousier"}, {"parrain": "La Bayadère", "filleul": "Tony Tony Chopper"}, {"parrain": "Goudurix", "filleul": "Simba"}, {"parrain": "Frère Tcheese", "filleul": "Dr Holmes"}, {"parrain": "Musashi", "filleul": "Forest"}, {"parrain": "L'Oxymore", "filleul": "Lucrèce"}, {"parrain": "Stimulus", "filleul": "Laddy Hopps"}, {"parrain": "Gargamelle dite la Brute", "filleul": "Melody"}, {"parrain": "Kasé de Plougastel", "filleul": "Frère Rackam la Joie"}, {"parrain": "Mistinguett", "filleul": "Scandale (Bichat)"}, {"parrain": "Mistinguett", "filleul": "Maître Renard"}, {"parrain": "Stimulus", "filleul": "Achille le Saltimbanque"}, {"parrain": "Gosby La Badouille", "filleul": "Lancelot"}, {"parrain": "Bolus", "filleul": "Chihiro"}, {"parrain": "Maximus dit le Truand", "filleul": "Capitaine Jack"}, {"parrain": "L'Utopic", "filleul": "Micromégas"}, {"parrain": "Chaplin", "filleul": "Tempête"}, {"parrain": "Simba", "filleul": "Fantomette"}, {"parrain": "Stimulus", "filleul": "Lotus"}, {"parrain": "L'Utopic", "filleul": "Nyx"}, {"parrain": "Melody", "filleul": "Django"}, {"parrain": "Apollo dit le Bon", "filleul": "Fantasia"}, {"parrain": "Apollo dit le Bon", "filleul": "Molière le Philanthrope"}, {"parrain": "Dr Holmes", "filleul": "Armstrong"}, {"parrain": "Dr Holmes", "filleul": "Hercule"}, {"parrain": "Forest", "filleul": "Cléopatre"}, {"parrain": "Tempête", "filleul": "Frère Luron"}, {"parrain": "Lotus", "filleul": "Matoaka intronisée La Louve"}, {"parrain": "Forest", "filleul": "Dexter"}, {"parrain": "Micromégas", "filleul": "Nimbus"}, {"parrain": "Armstrong", "filleul": "Kiddo"}, {"parrain": "Django", "filleul": "L'Arabesque"}, {"parrain": "Petit Jean du Grand Gousier", "filleul": "Frère Jacques le Tranquille"}, {"parrain": "Simba", "filleul": "Jan'e la Barré"}, {"parrain": "Fantomette", "filleul": "Scapin"}, {"parrain": "Fantasia", "filleul": "Bès le Furieux"}, {"parrain": "Achille le Saltimbanque", "filleul": "Billy Jones l'Exalté"}, {"parrain": "Lancelot", "filleul": "Pendragon"}, {"parrain": "Molière le Philanthrope", "filleul": "Maître Lupin"}, {"parrain": "Frère Jacques le Tranquille", "filleul": "Loyal"}, {"parrain": "Scapin", "filleul": "Artémus de Rochefort"}, {"parrain": "Bès le Furieux", "filleul": "Jean D. Haddock"}, {"parrain": "Lotus", "filleul": "La Rose Ecarlate"}, {"parrain": "Billy Jones l'Exalté", "filleul": "Atlantis"}, {"parrain": "Tutu (PO)", "filleul": "Tonktonk"}]}</script>
<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════════
     MOT DE PASSE — pour le changer, modifie UNIQUEMENT la ligne ci-dessous.
     ══════════════════════════════════════════════════════════════════ */
  const MOT_DE_PASSE = "Arbre_faluche_UP";

  (function porte(){
    const gate=document.getElementById('gate');
    const inp=document.getElementById('gate-pass');
    const btn=document.getElementById('gate-go');
    const err=document.getElementById('gate-err');
    if(!gate) return;
    function unlock(){
      if(inp.value === MOT_DE_PASSE){
        gate.classList.add('ok');
        setTimeout(()=>{ gate.style.display='none'; try{ fit(); }catch(e){} }, 440);
      } else {
        err.style.opacity = 1;
        gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
        inp.select();
      }
    }
    btn.addEventListener('click', unlock);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
    setTimeout(()=>inp.focus(), 60);
  })();

  const raw = JSON.parse(document.getElementById('data').textContent);

  // ---- modèle ----
  const byName = new Map();
  raw.personnes.forEach(p=>{ if(!byName.has(p.nom)) byName.set(p.nom,{id:p.nom,gen0:p.gen}); });
  raw.liens.forEach(l=>{ [l.parrain,l.filleul].forEach(n=>{ if(!byName.has(n)) byName.set(n,{id:n}); }); });
  const nodes = [...byName.values()];
  const parents = new Map(), children = new Map();
  nodes.forEach(n=>{parents.set(n.id,[]);children.set(n.id,[]);});
  const links = raw.liens.map(l=>{
    children.get(l.parrain).push(l.filleul);
    parents.get(l.filleul).push(l.parrain);
    return {source:l.parrain, target:l.filleul};
  });

  // out-degree -> taille ; longest path depuis racines -> génération (gestion des cycles)
  nodes.forEach(n=>{ n.deg = children.get(n.id).length; });
  const gen = new Map(), state0 = new Map();
  function genOf(id){
    if(gen.has(id)) return gen.get(id);
    if(state0.get(id)===1) return 0;           // cycle : on coupe
    state0.set(id,1);
    let g=0;
    for(const p of parents.get(id)) g=Math.max(g, genOf(p)+1);
    state0.set(id,2); gen.set(id,g); return g;
  }
  nodes.forEach(n=> n.gen = genOf(n.id));
  const maxGen = d3.max(nodes,d=>d.gen);

  document.getElementById('stat-n').textContent = nodes.length;
  document.getElementById('stat-e').textContent = links.length;
  document.getElementById('stat-g').textContent = maxGen+1;

  // datalist
  const dl = document.getElementById('names');
  nodes.map(n=>n.id).sort((a,b)=>a.localeCompare(b,'fr')).forEach(id=>{
    const o=document.createElement('option'); o.value=id; dl.appendChild(o);
  });

  // ---- couleurs ----
  const genColor = d3.scaleSequential().domain([0,Math.max(1,maxGen)])
    .interpolator(d3.interpolateRgbBasis(['#7fb3d5','#76d7c4','#7dcea0','#f2d06b','#e59866','#cf6f4e','#a3232f']));
  const C = {sel:'#e7c15a', up:'#cf3b40', down:'#19a78e', dim:'#4a4150', dimLink:'rgba(120,108,132,.10)'};
  // Dégradés de lignée : PROCHE de la personne = foncé, LOIN = clair.
  // (ordre du ramp : 0 = clair / loin, 1 = foncé / proche — modifie ces couleurs si besoin)
  const upRamp   = d3.interpolateRgbBasis(['#f3c9cd','#cf3b40','#6f0f17']); // parrains  -> rouge
  const downRamp = d3.interpolateRgbBasis(['#c4def2','#2f86c5','#0e3a63']); // filleul·e·s -> bleu

  function renderLegend(){
    const L = document.getElementById('legend');
    if(focusId){
      const upBar = `linear-gradient(90deg, ${upRamp(0)}, ${upRamp(1)})`;
      const downBar = `linear-gradient(90deg, ${downRamp(0)}, ${downRamp(1)})`;
      L.innerHTML =
        `<div style="margin-bottom:4px;font-weight:600;color:var(--ink)">Lignée de ${esc(focusId)}</div>`+
        `<span class="sw" style="background:${C.sel}"></span>Personne sélectionnée<br>`+
        `<span class="sw" style="background:${upBar};width:34px;border-radius:3px"></span> PM<br>`+
        `<span class="sw" style="background:${downBar};width:34px;border-radius:3px"></span> Fillots`;
      return;
    }
    if(colorMode==='gen'){
      let s='<div style="margin-bottom:4px;font-weight:600;color:var(--ink)">Génération (du plus ancien au plus récent)</div>';
      for(let g=0;g<=maxGen;g+=Math.ceil((maxGen+1)/6)) s+=`<span class="sw" style="background:${genColor(g)}"></span>G${g} &nbsp;`;
      s+='<div style="margin-top:6px">Taille du nœud = nombre de fillots.</div>';
      L.innerHTML=s;
    } else {
      L.innerHTML = `<div>Clique sur un nœud pour afficher sa lignée : PM en rouge, fillots en bleu.</div>`;
    }
  }
  // ---- positions initiales aléatoires ----
  nodes.forEach(n => {
    n.x = (Math.random() - 0.5) * 200;
    n.y = (Math.random() - 0.5) * 200;
  });

  // ---- simulation ----
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(34).strength(.32))
    .force('charge', d3.forceManyBody().strength(-150).distanceMax(360))
    .force('center', d3.forceCenter(0,0))
    .force('collide', d3.forceCollide().radius(d=>radius(d)+1.5))
    .alpha(1).alphaDecay(.022);

  function radius(d){ return 3 + Math.sqrt(d.deg)*1.7; }

  // ---- canvas ----
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const main = cv.parentElement;
  let W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1);
  let transform = d3.zoomIdentity;
  function resize(){
    W=main.clientWidth; H=main.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    draw();
  }
  window.addEventListener('resize', resize);

  // état focus
  let focusId=null, depth=2, colorMode='gen';
  let upDist=new Map(), downDist=new Map(), shown=null, maxUp=1, maxDown=1; // shown=null -> tout

  function computeFocus(){
    upDist=new Map(); downDist=new Map(); maxUp=1; maxDown=1;
    if(!focusId){ shown=null; return; }
    // remontée (parrains) — on mémorise la distance (nb de pas) à la personne ciblée
    let layer=new Set([focusId]);
    for(let d=1; d<=depth; d++){
      const next=new Set();
      layer.forEach(id=> parents.get(id).forEach(p=>{ if(p!==focusId && !upDist.has(p)){upDist.set(p,d); if(d>maxUp)maxUp=d; next.add(p);} }));
      layer=next; if(!layer.size) break;
    }
    // descente (filleul·e·s)
    layer=new Set([focusId]);
    for(let d=1; d<=depth; d++){
      const next=new Set();
      layer.forEach(id=> children.get(id).forEach(c=>{ if(c!==focusId && !downDist.has(c)){downDist.set(c,d); if(d>maxDown)maxDown=d; next.add(c);} }));
      layer=next; if(!layer.size) break;
    }
    shown=new Set([focusId,...upDist.keys(),...downDist.keys()]);
  }

  function nodeColor(d){
    if(focusId){
      if(d.id===focusId) return C.sel;
      // Dégradé de lignée : proche de la personne = foncé, loin = clair.
      if(upDist.has(d.id))   return upRamp(1-(upDist.get(d.id)-1)/Math.max(1,maxUp-1));
      if(downDist.has(d.id)) return downRamp(1-(downDist.get(d.id)-1)/Math.max(1,maxDown-1));
      return C.dim;
    }
    return colorMode==='lineage' ? C.dim : genColor(d.gen);
  }
  function inFocus(id){ return !shown || shown.has(id); }

  function draw(){
    ctx.save();
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.scale(dpr,dpr);
    ctx.translate(W/2,H/2);
    ctx.translate(transform.x,transform.y);
    ctx.scale(transform.k,transform.k);

    // liens
    ctx.lineWidth=.7;
    for(const l of links){
      const lit = focusId ? (shown.has(l.source.id)&&shown.has(l.target.id)) : true;
      ctx.strokeStyle = lit ? (focusId?'rgba(207,59,64,.30)':'rgba(150,135,120,.20)') : C.dimLink;
      ctx.beginPath();
      ctx.moveTo(l.source.x,l.source.y);
      ctx.lineTo(l.target.x,l.target.y);
      ctx.stroke();
    }
    // nœuds
    for(const n of nodes){
      const lit=inFocus(n.id), r=radius(n);
      ctx.globalAlpha = lit?1:.5;
      ctx.beginPath(); ctx.arc(n.x,n.y,r,0,6.283);
      ctx.fillStyle=nodeColor(n); ctx.fill();
      if(n.id===focusId){ ctx.lineWidth=2.4; ctx.strokeStyle='#fff'; ctx.stroke(); }
      ctx.globalAlpha=1;
    }
    // étiquettes : focus -> sous-graphe ; sinon -> gros hubs + survol
    ctx.font='600 11px Inter, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const labelIds = focusId ? shown : new Set(nodes.filter(n=>n.deg>=6).map(n=>n.id));
    if(transform.k>1.6 && !focusId) nodes.forEach(n=>labelIds.add(n.id)); // zoom : on montre tout
    for(const n of nodes){
      if(!labelIds.has(n.id)) continue;
      const r=radius(n);
      ctx.fillStyle='rgba(23,18,26,.78)';
      const w=ctx.measureText(n.id).width;
      ctx.fillRect(n.x-w/2-3, n.y+r+2, w+6, 13);
      ctx.fillStyle='#f4efe6'; ctx.fillText(n.id, n.x, n.y+r+9);
    }
    if(hover){
      const r=radius(hover);
      ctx.beginPath(); ctx.arc(hover.x,hover.y,r+3,0,6.283);
      ctx.lineWidth=2; ctx.strokeStyle=C.gold; ctx.stroke();
    }
    ctx.restore();
  }
  sim.on('tick', draw);

  // ---- interactions ----
  function toGraph(ev){
    const rect=cv.getBoundingClientRect();
    const px=ev.clientX-rect.left, py=ev.clientY-rect.top;
    return {x:(px-W/2-transform.x)/transform.k, y:(py-H/2-transform.y)/transform.k};
  }
  let hover=null;
  const tip=document.getElementById('tip');
  cv.addEventListener('mousemove',ev=>{
    const p=toGraph(ev);
    const n=sim.find(p.x,p.y,18);
    hover=n||null;
    if(n){
      tip.style.opacity=1;
      tip.style.left=(ev.clientX-main.getBoundingClientRect().left+14)+'px';
      tip.style.top=(ev.clientY-main.getBoundingClientRect().top+14)+'px';
      tip.innerHTML=`<b>${esc(n.id)}</b><div class="meta">Génération ${n.gen} · ${parents.get(n.id).length} parrain(s) · ${n.deg} filleul·e·s</div>`;
    } else { tip.style.opacity=0; }
    draw();
  });
  cv.addEventListener('mouseleave',()=>{hover=null;tip.style.opacity=0;draw();});

  const zoom=d3.zoom().scaleExtent([.15,6]).on('zoom',ev=>{
    // ne pas capter le drag de nœud
    if(ev.sourceEvent && ev.sourceEvent.type==='mousemove' && dragging) return;
    transform=ev.transform; draw();
  });
  d3.select(cv).call(zoom).on('dblclick.zoom',null);

  // drag de nœud
  let dragging=null;
  d3.select(cv).call(d3.drag()
    .container(cv)
    .subject(ev=>{ const p=toGraph(ev); return sim.find(p.x,p.y,18); })
    .on('start',ev=>{ if(!ev.subject)return; dragging=ev.subject; cv.classList.add('grabbing'); sim.alphaTarget(.25).restart(); ev.subject.fx=ev.subject.x; ev.subject.fy=ev.subject.y; })
    .on('drag',ev=>{ if(!dragging)return; const p=toGraph(ev); dragging.fx=p.x; dragging.fy=p.y; })
    .on('end',ev=>{ if(!dragging)return; cv.classList.remove('grabbing'); sim.alphaTarget(0); dragging=null; })
  );

  cv.addEventListener('click',ev=>{
    if(justDragged){justDragged=false;return;}
    const p=toGraph(ev); const n=sim.find(p.x,p.y,18);
    setFocus(n?n.id:null);
  });
  let justDragged=false;
  d3.select(cv).on('mousedown.flag',()=>{justDragged=false;});
  // marque un vrai drag pour ne pas déclencher le focus au relâché
  let downAt=null;
  cv.addEventListener('mousedown',ev=>downAt={x:ev.clientX,y:ev.clientY});
  cv.addEventListener('mouseup',ev=>{ if(downAt && Math.hypot(ev.clientX-downAt.x,ev.clientY-downAt.y)>4) justDragged=true; });

  // ---- focus + panneau ----
  function setFocus(id){
    focusId = id && byName.has(id) ? id : null;
    computeFocus(); renderFocusBox(); renderLegend(); draw();
  }
  function chip(id){ return `<span class="chip" data-go="${esc(id)}">${esc(id)}</span>`; }
  function renderFocusBox(){
    const box=document.getElementById('focusbox');
    if(!focusId){
      box.innerHTML='<div class="ph">Clique sur un nœud ou cherche un nom pour isoler sa lignée.</div>';
      return;
    }
    const ps=parents.get(focusId), cs=children.get(focusId);
    box.innerHTML =
      `<h2>${esc(focusId)}</h2>`+
      `<div class="lineage">`+
        `<div class="row"><span class="tag up">PM</span></div>`+
        (ps.length?`<div class="chips">${ps.map(chip).join('')}</div>`:'')+
        `<div class="row" style="margin-top:6px"><span class="tag down">Fillots</span><span>${cs.length||'—'}</span></div>`+
        (cs.length?`<div class="chips">${cs.map(chip).join('')}</div>`:'')+
        `<div class="row" style="margin-top:8px"><span class="tag">Lignée visible</span><span>${shown.size} pers. · ${depth} gén.</span></div>`+
      `</div>`;
    box.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{ const id=el.getAttribute('data-go'); document.getElementById('search').value=id; lastHit=id; setFocus(id); centerOn(id); }));
  }

  function centerOn(id){
    const n=byName.get(id); if(!n||n.x==null)return;
    const k=Math.max(transform.k,1.3);
    transform=d3.zoomIdentity.scale(k).translate(-n.x,-n.y);
    d3.select(cv).call(zoom.transform, d3.zoomIdentity.translate(-n.x*k,-n.y*k).scale(k));
    draw();
  }

  // ---- contrôles ----
  const searchEl = document.getElementById('search');
  let lastHit = null;
  function runSearch(){
    const v = searchEl.value.trim();
    if(byName.has(v)){
      if(v !== lastHit){ lastHit = v; setFocus(v); centerOn(v); }
    } else {
      lastHit = null;
      if(!v) setFocus(null);
    }
  }
  searchEl.addEventListener('input', runSearch);
  searchEl.addEventListener('change', runSearch);
  searchEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); runSearch(); } });
  const depthSlider=document.getElementById('depth'), depthVal=document.getElementById('depth-val');
  depthSlider.addEventListener('input',e=>{ depth=+e.target.value; depthVal.textContent=depth+' gén.'; computeFocus(); renderFocusBox(); draw(); });

  document.querySelectorAll('#colormode button').forEach(b=>b.addEventListener('click',()=>{
    colorMode=b.dataset.mode;
    document.querySelectorAll('#colormode button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    renderLegend(); draw();
  }));

  document.getElementById('reset').addEventListener('click',()=>{
    searchEl.value=''; lastHit=null; setFocus(null); fit();
  });
  document.getElementById('zin').onclick =()=>d3.select(cv).transition().call(zoom.scaleBy,1.4);
  document.getElementById('zout').onclick=()=>d3.select(cv).transition().call(zoom.scaleBy,1/1.4);
  document.getElementById('zfit').onclick=fit;

  function fit(){
    const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
    const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
    const gw=maxx-minx||1, gh=maxy-miny||1;
    const k=Math.min(.9*W/gw, .9*H/gh, 2);
    const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
    d3.select(cv).transition().duration(400).call(zoom.transform, d3.zoomIdentity.scale(k).translate(-cx,-cy));
  }

  // burger mobile
  document.getElementById('burger').onclick=()=>document.getElementById('panel').classList.toggle('open');

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  renderLegend();
  resize();
  // recadrage initial quand la simu s'est posée
  sim.on('end',()=>{});
  setTimeout(fit, 900);
})();
</script>
</body>
</html>
